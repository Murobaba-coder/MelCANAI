<style>
:root{
  box-sizing:border-box;
  --bg:#f3f1fb; --panel:#ffffff; --ink:#1d1b2e; --muted:#6b6785;
  --accent:#7c5cff; --accent-ink:#ffffff; --bubble-me:#7c5cff; --bubble-me-ink:#fff;
  --bubble-ai:#e8e4f8; --line:#d9d4ee; --link:#4a2fd0;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1e1e2e; --panel:#2b2b3d; --ink:#f1effb; --muted:#a29fbd;
    --bubble-ai:#37374f; --line:#3d3d58; --link:#b9a8ff;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1e2e; --panel:#2b2b3d; --ink:#f1effb; --muted:#a29fbd;
  --bubble-ai:#37374f; --line:#3d3d58; --link:#b9a8ff;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Nunito","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.app{display:flex;flex-direction:column;width:100%;max-width:640px;height:100%}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
header h1{margin:0;font-size:1.25rem;font-weight:800}
header span{color:var(--muted);font-size:.85rem}
.header-btns{margin-left:auto; display:flex; gap:8px;}
#theme,#ayar-btn,#menu,#yan-kapat{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;width:38px;height:38px;font-size:1.1rem;cursor:pointer; display:flex; align-items:center; justify-content:center;}
#theme:focus-visible,#ayar-btn:focus-visible,#menu:focus-visible,#yan-kapat:focus-visible,.yeni:focus-visible,.oge-ad:focus-visible,.oge-sil:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.ikon:focus-visible,.quick button.acik:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.quick button.acik{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
[hidden]{display:none!important}
#ayar-panel{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px}
.ayar-kutu{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(100%,380px);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.ayar-kutu h2{margin:0;font-size:1.1rem}

.ayar-not{font-size:.8rem;color:var(--muted);margin:0}

.eylem{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;white-space:normal}
.eylem button{font:inherit;font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.eylem button:focus-visible,.quick select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.quick select{flex:none;font:inherit;font-size:.85rem;padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.uyari{margin:-6px 0 0;padding:0 16px 10px;font-size:.75rem;color:var(--muted);text-align:center}
#dosya-chip{display:none;align-items:center;gap:8px;padding:0 16px 6px}
#dosya-chip span{font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dosya-chip .ikon{width:36px;height:36px;font-size:.9rem}
.kaynaklar{margin-top:8px;font-size:.78rem;white-space:normal}
.kaynaklar b{display:block;margin-bottom:4px}
.kaynaklar a{display:block;color:var(--accent);text-decoration:underline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#onizle{display:none;align-items:center;gap:10px;padding:0 16px 6px}
#onizle img{height:52px;width:52px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
#onizle .ikon{width:36px;height:36px;font-size:.9rem}
</style>

<div id="ayar-panel" hidden role="dialog" aria-modal="true" aria-labelledby="ayar-baslik">

<script>
// ====== AYAR: Cloudflare Worker adresini buraya yapıştır ======
// Örnek: "https://melcan-ai.kullaniciadin.workers.dev"
// Boş bırakırsan site sadece yerel (çevrimdışı) modda çalışır.
const WORKER_URL = "https://melcan-ai.fatmafetretmrt.workers.dev";
// ==============================================================

const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.toLocaleLowerCase("tr").replace(/[ıİ]/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
  .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[âä]/g,"a").replace(/[î]/g,"i")
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}

function has(m,key){
  if((" "+m).includes(" "+key)) return true;
  if(key.includes(" ")||key.length<4) return false;
  const tol=key.length>=7?2:1;
  return m.split(" ").some(w=>w.length>=3&&lev(w,key)<=tol);
}
const hasAny=(m,keys)=>keys.some(k=>has(m,k));

const L={get(){try{return JSON.parse(localStorage.getItem("melcan_ogrendi")||"{}");}catch(e){return {};}},
  set(o){try{localStorage.setItem("melcan_ogrendi",JSON.stringify(o));}catch(e){}}};

let isim="";
try{ isim=localStorage.getItem("melcan_isim")||""; }catch(e){}
let bekleIsim=!isim;
let mod="",sayi=0,hak=0,benP=0,onP=0,bekleyenSoru="";
let gecmis=[];       // yapay zekaya gönderilen sohbet geçmişi
let bekliyor=false;  // cevap beklenirken ikinci mesajı engelle
const log=document.getElementById("log");
const sendBtn=document.getElementById("send");

// ---- Yapay zeka: Worker üzerinden (API key sunucuda gizli), cevap akarak gelir ----
let sesliAcik=false, bekleyenResim=null, aktifDosya=null;
const MODLAR=[["sohbet","💬 Sohbet"],["odev","📚 Ödev yardımcısı"],["fikra","😄 Fıkra"],["dini","🕌 Dini bilgi"],["tarif","🍲 Yemek tarifi"]];
let aktifMod="sohbet";
try{ const m0=localStorage.getItem("melcan_mod"); if(MODLAR.some(x=>x[0]===m0)) aktifMod=m0; }catch(e){}
try{ sesliAcik=localStorage.getItem("melcan_sesli")==="1"; }catch(e){}

async function askAI(mesaj,resim,onParca,dosya){
  const ctrl=new AbortController();
  let zt=setTimeout(()=>ctrl.abort(),65000);
  let res;
  try{
    res=await fetch(WORKER_URL,{
      method:"POST",
      signal:ctrl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:mesaj,history:gecmis,mode:aktifMod,image:resim?{mime:resim.mime,data:resim.data}:undefined,file:dosya?{mime:dosya.mime,data:dosya.data,name:dosya.ad}:undefined})
    });
  }catch(e){
    clearTimeout(zt);
    throw new Error(e.name==="AbortError"?"Cevap çok geç geldi, tekrar dene.":"Sunucuya ulaşılamadı.");
  }
  if(!res.ok){
    clearTimeout(zt);
    let d={}; try{ d=await res.json(); }catch(e){}
    throw new Error(d.error||"Sunucu hatası ("+res.status+")");
  }
  const rd=res.body.getReader(), dec=new TextDecoder();
  let tam="";
  try{
    while(true){
      const {done,value}=await rd.read();
      if(done) break;
      clearTimeout(zt); zt=setTimeout(()=>ctrl.abort(),30000);
      tam+=dec.decode(value,{stream:true});
      onParca(tam.split("\u0001")[0]);
    }
  }catch(e){
    if(!tam.trim()) throw new Error("Cevap yarıda kesildi, tekrar dene.");
  }finally{ clearTimeout(zt); }
  tam+=dec.decode();
  let kaynaklar=[];
  const ix=tam.indexOf("\u0001");
  if(ix>=0){
    try{ kaynaklar=JSON.parse(tam.slice(ix+1)).filter(k=>k&&/^https?:\/\//.test(k.u)).slice(0,6).map(k=>({t:String(k.t||k.u).slice(0,80),u:k.u})); }catch(e){}
    tam=tam.slice(0,ix);
  }
  tam=tam.trim();
  if(!tam) throw new Error("Boş cevap geldi, tekrar dene.");
  return {metin:tam,kaynaklar};
}

// ---- Güvenli biçimlendirme: **kalın**, `kod`, ``` kod bloğu ```, - liste (innerHTML kullanmaz) ----
function satirIci(el,satir){
  satir.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/).forEach(p=>{
    if(!p) return;
    if(p.startsWith("**")&&p.endsWith("**")&&p.length>4){ const b=document.createElement("strong"); b.textContent=p.slice(2,-2); el.appendChild(b); }
    else if(p.startsWith("`")&&p.endsWith("`")&&p.length>2){ const c=document.createElement("code"); c.textContent=p.slice(1,-1); el.appendChild(c); }
    else el.appendChild(document.createTextNode(p));
  });
}
function bicimle(el,metin){
  el.textContent="";
  const parcalar=metin.split("```");
  parcalar.forEach((p,i)=>{
    if(i%2===1){
      const pre=document.createElement("pre"), c=document.createElement("code");
      c.textContent=p.replace(/^[a-zA-Z0-9+#-]*\n/,"").replace(/\n$/,"");
      pre.appendChild(c); el.appendChild(pre);
    } else {
      if(i>0) p=p.replace(/^\n/,"");
      if(i<parcalar.length-1) p=p.replace(/\n$/,"");
      const satirlar=p.split("\n");
      satirlar.forEach((st,k)=>{
        st=st.replace(/^#{1,6}\s+(.*)$/,"**$1**");
        const liste=st.match(/^\s*[-*•]\s+(.*)$/);
        if(liste){ el.appendChild(document.createTextNode("• ")); satirIci(el,liste[1]); }
        else satirIci(el,st);
        if(k<satirlar.length-1) el.appendChild(document.createTextNode("\n"));
      });
    }
  });
}

const KAYIT_KEY="melcan_sohbet", GECMIS_KEY="melcan_gecmis"; // eski tek sohbet (taşıma için)
const LISTE_KEY="melcan_sohbetler", AKTIF_KEY="melcan_aktif";
let kayitli=[], sohbetler=[], aktifId="";
const yanEl=document.getElementById("yan"), perdeEl=document.getElementById("perde");
function yanAc(){ yanEl.classList.add("acik"); perdeEl.classList.add("acik"); }
function yanKapat(){ yanEl.classList.remove("acik"); perdeEl.classList.remove("acik"); }
function yeniId(){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function aktifSohbet(){ return sohbetler.find(x=>x.id===aktifId); }
function listeKaydet(){
  try{
    localStorage.setItem(LISTE_KEY,JSON.stringify(sohbetler));
    localStorage.setItem(AKTIF_KEY,aktifId);
  }catch(e){}
}
function kaydet(){
  const sh=aktifSohbet();
  if(sh){ sh.kayitli=kayitli.slice(-60); sh.gecmis=gecmis; sh.t=Date.now(); }
  listeKaydet(); listeCiz();
}
function listeCiz(){
  const kutu=document.getElementById("liste"); kutu.innerHTML="";
  sohbetler.slice().sort((a,b)=>b.t-a.t).forEach(sh=>{
    const satir=document.createElement("div"); satir.className="oge"+(sh.id===aktifId?" aktif":"");
    const ad=document.createElement("button"); ad.type="button"; ad.className="oge-ad";
    ad.textContent=sh.baslik||"Yeni sohbet"; ad.onclick=()=>sohbetAc(sh.id);
    const sil=document.createElement("button"); sil.type="button"; sil.className="oge-sil";
    sil.textContent="🗑️"; sil.setAttribute("aria-label","Sohbeti sil"); sil.onclick=()=>sohbetSil(sh.id);
    satir.append(ad,sil); kutu.appendChild(satir);
  });
}
function sohbetAc(id){
  if(bekliyor) return;
  const sh=sohbetler.find(x=>x.id===id); if(!sh) return;
  aktifId=id;
  kayitli=Array.isArray(sh.kayitli)?sh.kayitli.slice():[];
  gecmis=Array.isArray(sh.gecmis)?sh.gecmis.slice():[];
  mod=""; bekleyenSoru=""; sonSoru=null; aktifDosya=null; { const dc=document.getElementById("dosya-chip"); if(dc) dc.style.display="none"; }
  log.innerHTML="";
  if(kayitli.length){
    const kopya=kayitli.slice(); kayitli=[];
    kopya.forEach(x=>{ const d=yaz(x.t,x.k,x.l,false); if(x.k==="ai"&&x.g) eylemEkle(d,x.t,false,x.s); });
    kayitli=kopya;
  } else yaz(selam(),"ai",null,false);
  listeKaydet(); listeCiz(); yanKapat();
}
function yeniSohbet(){
  if(bekliyor) return;
  if(aktifSohbet() && !kayitli.length){ yanKapat(); document.getElementById("in").focus(); return; }
  const sh={id:yeniId(),baslik:"Yeni sohbet",t:Date.now(),kayitli:[],gecmis:[]};
  sohbetler.unshift(sh); sohbetler=sohbetler.slice(0,25);
  sohbetAc(sh.id);
}
function sohbetSil(id){
  if(bekliyor) return;
  if(!confirm("Bu sohbet silinsin mi?")) return;

function sayiCevap(m){
  if(!/^\d+$/.test(m)) return "Lütfen bir sayı yaz. (Çıkmak için 'menü' yaz)";
  const t=parseInt(m,10); hak++;
  if(t<sayi) return "Daha büyük bir sayı söyle.";
  if(t>sayi) return "Daha küçük bir sayı söyle.";
  mod=""; return "Tebrikler! "+hak+" denemede buldun! 🎉";
}

function tkmCevap(m){
  if(["kagit","kagıt"].includes(m)) m="kagit";
  const s=["tas","kagit","makas"], ad={tas:"taş",kagit:"kağıt",makas:"makas"};
  if(!s.includes(m)) return "Taş, kağıt ya da makas yazmalısın. (Çıkmak için 'menü' yaz)";
  const b=pick(s); let r="Ben "+ad[b]+" seçtim. ";
  if(m===b) r+="Berabere!";
  else if((m==="tas"&&b==="makas")||(m==="kagit"&&b==="tas")||(m==="makas"&&b==="kagit")){benP++;r+="Sen kazandın!";}
  else {onP++;r+="Ben kazandım!";}
  return r+"\nSkor: Sen "+benP+" - Ben "+onP;
}

// Yerel cevap: oyunlar + öğrenen bot (çevrimdışı mod)
function cevap(raw){
  const m=norm(raw);
  const cikis=["menu","cik","vazgec","iptal"].includes(m);

  if(mod==="ogret"){
    mod="";
    if(cikis){ bekleyenSoru=""; return "Tamam, vazgeçtik."; }
    const o=L.get(); o[bekleyenSoru]=raw.trim().slice(0,300);
    L.set(o); bekleyenSoru="";
    return "Teşekkürler, öğrendim! Bir daha sorarsan cevaplayacağım. 🧠";
  }
  if(mod){
    if(cikis){
      const son=mod==="tkm"?"Final skoru: Sen "+benP+" - Ben "+onP+". ":"";
      mod=""; return son+"Oyundan çıktık, sohbete devam edebiliriz.";
    }
    return mod==="sayi"?sayiCevap(m):tkmCevap(m);
  }
  if(has(m,"sayi")&&hasAny(m,["oyun","tahmin"])){
    mod="sayi"; sayi=1+Math.floor(Math.random()*100); hak=0;
    return "1 ile 100 arasında bir sayı tuttum, bul bakalım! (Çıkmak için 'menü' yaz)";
  }
  if(hasAny(m,["makas","tas kagit"])){
    mod="tkm"; benP=0; onP=0;
    return "Taş-kâğıt-makas! Taş, kağıt ya da makas yaz. (Çıkmak için 'menü' yaz)";
  }
  if(m==="menu") return "Sayı oyunu ya da taş-kâğıt-makas oynayabiliriz, ya da bana bir şey sor!";

  const o=L.get();
  for(const q in o) if(q===m||lev(q,m)<=Math.floor(q.length/6)) return o[q];

  mod="ogret"; bekleyenSoru=m;
  return {t:"Bunu bilmiyorum. Cevabı sen öğretir misin? Yazdığın cevabı hatırlarım. (Vazgeçmek için 'vazgeç' yaz)",
    link:{text:"🔎 Google'da ara",url:"https://www.google.com/search?q="+encodeURIComponent(raw.trim())}};
}

}

function resmiHazirla(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const k=Math.min(1,1024/Math.max(im.width,im.height));
      const w=Math.round(im.width*k), h=Math.round(im.height*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
      let kal=.82, d=c.toDataURL("image/jpeg",kal);
      while(d.length>1400000&&kal>.4){ kal-=.12; d=c.toDataURL("image/jpeg",kal); }
      res({mime:"image/jpeg",data:d.split(",")[1],onizleme:d});
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("Resim okunamadı.")); };
    im.src=url;
  });
}

}

let sesBaglam=null;
function ton(f,bas,sure,tip,vol){
  const c=sesBaglam; const o=c.createOscillator(), g=c.createGain();
  o.type=tip; o.frequency.value=f;
  const t0=c.currentTime+bas, v=Math.max(0.0001,vol);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(v,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+sure);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+sure+0.02);
}
const EFEKTLER={
  gonder:[[740,0,.07,"sine"],[988,.06,.09,"sine"]],
  cevap:[[660,0,.1,"sine"],[880,.09,.14,"sine"]],
  hata:[[220,0,.18,"sawtooth"],[165,.16,.24,"sawtooth"]],
  kazan:[[523,0,.11,"triangle"],[659,.1,.11,"triangle"],[784,.2,.11,"triangle"],[1047,.3,.22,"triangle"]],
  kaybet:[[392,0,.16,"triangle"],[330,.15,.16,"triangle"],[262,.3,.28,"triangle"]]
};
function fx(ad){
  if(!ayar.efekt||ayar.efektSes<=0) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(!sesBaglam) sesBaglam=new AC();
    if(sesBaglam.state==="suspended") sesBaglam.resume();
    const vol=0.3*ayar.efektSes;
    (EFEKTLER[ad]||[]).forEach(n=>ton(n[0],n[1],n[2],n[3],vol));
  }catch(e){}
}

  aNot.textContent=!hepsi.length?"Bu cihazda ses listesi henüz yüklenmedi, birkaç saniye sonra paneli tekrar aç."
    :tr.length?"Cihazındaki Türkçe sesler gösteriliyor. Liste telefona ve tarayıcıya göre değişir."
    :"Bu cihazda Türkçe ses bulunamadı, tüm sesler gösteriliyor. Türkçe okumayabilir.";
}
function ayarAc(){
  aEfekt.checked=ayar.efekt; aEfektSes.value=ayar.efektSes; aHiz.value=ayar.hiz;
  sesListesiDoldur(); panelEl.hidden=false; document.getElementById("a-kapat").focus();
}
function ayarKapat(){ if(!panelEl.hidden){ panelEl.hidden=true; try{speechSynthesis.cancel();}catch(e){} document.getElementById("ayar-btn").focus(); } }
document.getElementById("ayar-btn").onclick=ayarAc;
document.getElementById("a-kapat").onclick=ayarKapat;
panelEl.addEventListener("click",e=>{ if(e.target===panelEl) ayarKapat(); });
aEfekt.onchange=()=>{ ayar.efekt=aEfekt.checked; ayarKaydet(); fx("cevap"); };
aEfektSes.oninput=()=>{ ayar.efektSes=parseFloat(aEfektSes.value); ayarKaydet(); };
aEfektSes.onchange=()=>fx("cevap");
aSes.onchange=()=>{ ayar.ses=aSes.value; ayarKaydet(); };
aHiz.oninput=()=>{ ayar.hiz=parseFloat(aHiz.value); ayarKaydet(); };
document.getElementById("a-dene").onclick=()=>{ fx("kazan"); if(TTS) setTimeout(()=>konus("Merhaba, ben Melcan AI."),500); };
if(TTS && speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged",()=>{ if(!panelEl.hidden) sesListesiDoldur(); });

// ---- Uygulama (PWA) ----
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
let yukleOlayi=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); yukleOlayi=e;
  const b=document.createElement("button"); b.type="button"; b.textContent="📲 Uygulamayı yükle";
  b.onclick=async()=>{ yukleOlayi.prompt(); try{ await yukleOlayi.userChoice; }catch(_){} yukleOlayi=null; b.remove(); };
  q.appendChild(b);
});
</script>
