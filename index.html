<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melcan AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
<style>
:root{
  box-sizing:border-box;
  --bg:#f3f1fb; --panel:#ffffff; --ink:#1d1b2e; --muted:#6b6785;
  --accent:#7c5cff; --accent-ink:#ffffff; --bubble-me:#7c5cff; --bubble-me-ink:#fff;
  --bubble-ai:#e8e4f8; --line:#d9d4ee; --link:#4a2fd0;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1e1e2e; --panel:#2b2b3d; --ink:#f1effb; --muted:#a29fbd;
    --bubble-ai:#37374f; --line:#3d3d58; --link:#b9a8ff;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1e2e; --panel:#2b2b3d; --ink:#f1effb; --muted:#a29fbd;
  --bubble-ai:#37374f; --line:#3d3d58; --link:#b9a8ff;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Nunito","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.app{display:flex;flex-direction:column;width:100%;max-width:640px;height:100%}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
header h1{margin:0;font-size:1.25rem;font-weight:800}
header span{color:var(--muted);font-size:.85rem}
.header-btns{margin-left:auto; display:flex; gap:8px;}
#theme, #api-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;width:38px;height:38px;font-size:1.1rem;cursor:pointer; display:flex; align-items:center; justify-content:center;}
#theme:focus-visible, #api-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg a{color:var(--link);font-weight:700}
.me a{color:#fff}
.ai{align-self:flex-start;background:var(--bubble-ai);border-bottom-left-radius:6px}
.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:6px}
.quick{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.quick button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:8px 12px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
.quick button:focus-visible,#send:focus-visible,#in:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
form{display:flex;gap:8px;padding:8px 16px 14px}
#in{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:14px;padding:12px 14px;font:inherit;font-size:1rem}
#send{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;
  padding:0 18px;border-radius:14px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Melcan AI</h1>
    <span>sohbet, bilgi, oyun, öğrenen bot</span>
    <div class="header-btns">
      <button id="api-btn" type="button" aria-label="API Anahtarı Ekle" title="Gemini API Anahtarı Ekle">🔑</button>
      <button id="theme" type="button" aria-label="Açık/koyu tema">🌓</button>
    </div>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form id="form">
    <input id="in" autocomplete="off" placeholder="Bir mesaj yaz..." aria-label="Mesaj">
    <button id="send" type="submit">Gönder</button>
  </form>
</div>
<script>
const GUNLER=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const FIKRALAR=[
 "Temel sınıfta öğretmene sormuş: 'Hocam, hiç yapmadığım bir şey için ceza verir misiniz?' Öğretmen: 'Tabii ki hayır.' Temel: 'O zaman ödevimi yapmadım.'",
 "Nasreddin Hoca göle maya çalıyormuş. Sormuşlar: 'Hocam ne yapıyorsun?' Hoca: 'Belki tutar da yoğurt olur.' 'Hiç göl yoğurt olur mu?' Hoca: 'Ya tutarsa?'"
];
const ONERILER=["Bir film ya da dizi izleyebilirsin.","Dışarı çıkıp biraz yürüyüş yapabilirsin.","Benimle sayı tahmin oyunu ya da taş-kâğıt-makas oynayabilirsin!"];

const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.toLocaleLowerCase("tr").replace(/[ıİ]/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
  .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[âä]/g,"a").replace(/[î]/g,"i")
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}

function has(m,key){
  if((" "+m).includes(" "+key)) return true;
  if(key.includes(" ")||key.length<4) return false;
  const tol=key.length>=7?2:1;
  return m.split(" ").some(w=>w.length>=3&&lev(w,key)<=tol);
}
const hasAny=(m,keys)=>keys.some(k=>has(m,k));

const L={get(){try{return JSON.parse(localStorage.getItem("melcan_ogrendi")||"{}");}catch(e){return {};}},
  set(o){try{localStorage.setItem("melcan_ogrendi",JSON.stringify(o));}catch(e){}}};

let isim="";
try{ isim=localStorage.getItem("melcan_isim")||""; }catch(e){}
let bekleIsim=!isim;
let sonKonu="",mod="",sayi=0,hak=0,benP=0,onP=0,bekleyenSoru="";
const log=document.getElementById("log");

let apiKey = "";
let calisanModel = "";
try { apiKey = localStorage.getItem("melcan_apikey") || ""; } catch(e) {}

document.getElementById("api-btn").onclick = () => {
  const key = prompt("Google Gemini API Anahtarınızı girin:\n(Anahtar sadece bu tarayıcıda yerel olarak saklanır.)", apiKey);
  if (key !== null) {
    apiKey = key.trim();
    calisanModel = "";
    if (apiKey) {
      localStorage.setItem("melcan_apikey", apiKey);
      alert("API Anahtarı eklendi! Gerçek yapay zeka devrede.");
    } else {
      localStorage.removeItem("melcan_apikey");
      alert("API Anahtarı silindi. Çevrimdışı (yerel) sürüme dönüldü.");
    }
  }
};

async function askGemini(promptText, key) {
  const sistemKarakteri = `Senin adın MelCANAI. Kurucun ve geliştiricin Mehmet Ali Şanal'dır.
  Moleküler Biyoloji, Genetik ve biyoteknoloji alanlarında ileri düzey bir asistansın.
  Özellikle biyosensör teknolojileri, elektroaktif bakteriler (Shewanella oneidensis MR-1) ve mikrobiyal yakıt hücreleri konularında derin analitik bilgiye sahipsin.
  TEKNOFEST gibi inovasyon yarışmalarında ve AetherSense gibi proje geliştirme süreçlerinde kurucuna teknik araştırma desteği sağlarsın.
  Cevapların daima doğrudan, net, profesyonel ve akademik olmalıdır. Kendini hiçbir koşulda Google veya Gemini olarak tanıtma.`;

  let denenecekModeller = [];

  if (calisanModel) {
    denenecekModeller = [calisanModel];
  } else {
    // Google sunucusundan bu API anahtarına açık olan güncel modelleri çekiyoruz
    const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
    const listData = await listRes.json();
    if (!listRes.ok) throw new Error(listData.error?.message || "API Anahtarı doğrulanamadı.");

    const uygunModeller = (listData.models || [])
      .filter(m => 
        m.name.includes("gemini") && 
        !m.name.includes("tts") && 
        !m.name.includes("image") && 
        !m.name.includes("vision") && 
        !m.name.includes("embedding") && 
        m.supportedGenerationMethods?.includes("generateContent")
      )
      .map(m => m.name);

    // En üst seviye modellerden başlayarak sırala
    const siralama = [
      ...uygunModeller.filter(m => m.includes("2.5-pro")),
      ...uygunModeller.filter(m => m.includes("2.5-flash")),
      ...uygunModeller.filter(m => m.includes("2.0-flash")),
      ...uygunModeller.filter(m => m.includes("pro")),
      ...uygunModeller.filter(m => m.includes("flash")),
      ...uygunModeller
    ];
    denenecekModeller = [...new Set(siralama)];
  }

  if (denenecekModeller.length === 0) {
    throw new Error("Hesabınızda kullanılabilir aktif bir model bulunamadı.");
  }

  let sonHata = "";
  for (const modelAdi of denenecekModeller) {
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/${modelAdi}:generateContent?key=${key}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: sistemKarakteri }] },
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const data = await response.json();
      if (response.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
        calisanModel = modelAdi; // Çalışan en güçlü modeli hafızaya al
        return data.candidates[0].content.parts[0].text;
      } else {
        sonHata = data.error?.message || "Model yanıt vermedi.";
      }
    } catch (err) {
      sonHata = err.message;
    }
  }

  calisanModel = "";
  throw new Error(sonHata);
}

function yaz(metin,kim,link){
  const d=document.createElement("div");
  d.className="msg "+kim; d.textContent=metin;
  if(link){
    d.appendChild(document.createTextNode("\n"));
    const a=document.createElement("a"); a.href=link.url; a.target="_blank"; a.rel="noopener";
    a.textContent=link.text; d.appendChild(a);
  }
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}

function sayiCevap(m){
  if(!/^\d+$/.test(m)) return "Lütfen bir sayı yaz. (Çıkmak için 'menü' yaz)";
  const t=parseInt(m,10); hak++;
  if(t<sayi) return "Daha büyük bir sayı söyle.";
  if(t>sayi) return "Daha küçük bir sayı söyle.";
  mod=""; return "Tebrikler! "+hak+" denemede buldun! 🎉";
}

function tkmCevap(m){
  if(["kagit","kagıt"].includes(m)) m="kagit";
  const s=["tas","kagit","makas"], ad={tas:"taş",kagit:"kağıt",makas:"makas"};
  if(!s.includes(m)) return "Taş, kağıt ya da makas yazmalısın. (Çıkmak için 'menü' yaz)";
  const b=pick(s); let r="Ben "+ad[b]+" seçtim. ";
  if(m===b) r+="Berabere!";
  else if((m==="tas"&&b==="makas")||(m==="kagit"&&b==="tas")||(m==="makas"&&b==="kagit")){benP++;r+="Sen kazandın!";}
  else {onP++;r+="Ben kazandım!";}
  return r+"\nSkor: Sen "+benP+" - Ben "+onP;
}

function cevap(raw){
  const m=norm(raw);
  const cikis=["menu","cik","vazgec","iptal"].includes(m);

  if(mod==="ogret"){
    mod="";
    if(cikis){ bekleyenSoru=""; return "Tamam, vazgeçtik."; }
    const o=L.get(); o[bekleyenSoru]=raw.trim().slice(0,300);
    L.set(o); bekleyenSoru="";
    return "Teşekkürler, öğrendim! Bir daha sorarsan cevaplayacağım. 🧠";
  }
  if(mod){
    if(cikis){
      const son=mod==="tkm"?"Final skoru: Sen "+benP+" - Ben "+onP+". ":"";
      mod=""; return son+"Oyundan çıktık, sohbete devam edebiliriz.";
    }
    return mod==="sayi"?sayiCevap(m):tkmCevap(m);
  }
  if(has(m,"sayi")&&hasAny(m,["oyun","tahmin"])){
    mod="sayi"; sayi=1+Math.floor(Math.random()*100); hak=0;
    return "1 ile 100 arasında bir sayı tuttum, bul bakalım! (Çıkmak için 'menü' yaz)";
  }
  if(hasAny(m,["makas","tas kagit"])){
    mod="tkm"; benP=0; onP=0;
    return "Taş-kâğıt-makas! Taş, kağıt ya da makas yaz. (Çıkmak için 'menü' yaz)";
  }

  const o=L.get();
  for(const q in o) if(q===m||lev(q,m)<=Math.floor(q.length/6)) return o[q];

  mod="ogret"; bekleyenSoru=m;
  return {t:"Bunu bilmiyorum. Cevabı sen öğretir misin? Yazdığın cevabı hatırlarım. (Vazgeçmek için 'vazgeç' yaz)",
    link:{text:"🔎 Google'da ara",url:"https://www.google.com/search?q="+encodeURIComponent(raw.trim())}};
}

async function gonder(metin){
  yaz(metin,"me");
  if(bekleIsim){
    isim=metin.trim().slice(0,30)||"Dost"; bekleIsim=false;
    try{ localStorage.setItem("melcan_isim",isim); }catch(e){}
    yaz("Memnun oldum "+isim+"! Sağ üstteki 🔑 ikonuna tıklayıp API anahtarını eklersen sana gerçek bir yapay zeka olarak cevap verebilirim. Ekleyene kadar yerel sürümdeyim.", "ai");
    return;
  }
  
  const t=document.createElement("div"); t.className="msg ai"; t.textContent="…";
  log.appendChild(t); log.scrollTop=log.scrollHeight;

  const m = norm(metin);
  const yerelKomutlar = hasAny(m, ["sayi", "oyun", "tahmin", "makas", "tas kagit", "menu", "cik", "vazgec", "iptal"]);

  if (apiKey && !mod && !yerelKomutlar) {
    try {
      const aiCevap = await askGemini(metin, apiKey);
      t.remove();
      yaz(aiCevap, "ai");
    } catch (e) {
      t.remove();
      yaz("API Hatası: " + e.message + "\nLütfen sağ üstteki anahtar ikonundan API anahtarını kontrol et.", "ai");
    }
  } else {
    setTimeout(()=>{ 
      t.remove(); 
      const c=cevap(metin);
      if(typeof c==="string") yaz(c,"ai"); else yaz(c.t,"ai",c.link); 
    },450);
  }
}

document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  const i=document.getElementById("in"); const v=i.value.trim();
  if(!v) return; i.value=""; gonder(v);
});

const root=document.documentElement;
try{ const tm=localStorage.getItem("melcan_tema"); if(tm) root.setAttribute("data-theme",tm); }catch(e){}
document.getElementById("theme").onclick=()=>{
  const cur=root.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  const n=dark?"light":"dark"; root.setAttribute("data-theme",n);
  try{ localStorage.setItem("melcan_tema",n); }catch(e){}
};

const q=document.getElementById("quick");
[["🔢 Sayı oyunu","sayı oyunu"],["✊ Taş-kâğıt-makas","taş kağıt makas"],["🏠 Menü","menü"]]
.forEach(([txt,k])=>{
  const b=document.createElement("button"); b.type="button"; b.textContent=txt;
  b.onclick=()=>{ if(!bekleIsim) gonder(k); }; q.appendChild(b);
});
yaz(bekleIsim?"Merhaba! Ben Melcan AI. Senin adın ne?":"Merhaba "+isim+"! Sağ üst köşedeki 🔑 butonundan API bağlayabilir veya yerel sürümde oyun oynayabilirsin.","ai");
</script>
</body>
</html>
