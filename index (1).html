<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melcan AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c5cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Melcan AI">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
<style>
:root{
  box-sizing:border-box;
  --bg:#f3f1fb; --panel:#ffffff; --ink:#1d1b2e; --muted:#6b6785;
  --accent:#7c5cff; --accent-ink:#ffffff; --bubble-me:#7c5cff; --bubble-me-ink:#fff;
  --bubble-ai:#e8e4f8; --line:#d9d4ee; --link:#4a2fd0;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1e1e2e; --panel:#2b2b3d; --ink:#f1effb; --muted:#a29fbd;
    --bubble-ai:#37374f; --line:#3d3d58; --link:#b9a8ff;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1e2e; --panel:#2b2b3d; --ink:#f1effb; --muted:#a29fbd;
  --bubble-ai:#37374f; --line:#3d3d58; --link:#b9a8ff;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Nunito","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.app{display:flex;flex-direction:column;width:100%;max-width:640px;height:100%}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
header h1{margin:0;font-size:1.25rem;font-weight:800}
header span{color:var(--muted);font-size:.85rem}
.header-btns{margin-left:auto; display:flex; gap:8px;}
#theme,#menu,#yan-kapat{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;width:38px;height:38px;font-size:1.1rem;cursor:pointer; display:flex; align-items:center; justify-content:center;}
#theme:focus-visible,#menu:focus-visible,#yan-kapat:focus-visible,.yeni:focus-visible,.oge-ad:focus-visible,.oge-sil:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#menu,#yan-kapat{display:none}
.kap{display:flex;width:100%;height:100%}
.ana{flex:1;min-width:0;display:flex;justify-content:center}
.yan{width:270px;flex:none;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--panel);border-right:1px solid var(--line);overflow:hidden}
.yan-ust{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem}
.yeni{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;padding:11px;border-radius:12px;cursor:pointer}
.liste{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.oge{display:flex;align-items:center;border-radius:10px}
.oge:hover,.oge.aktif{background:var(--bubble-ai)}
.oge-ad{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:.92rem;padding:10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oge.aktif .oge-ad{font-weight:800}
.oge-sil{background:none;border:0;cursor:pointer;padding:8px;opacity:.55;font-size:.9rem}
.oge-sil:hover{opacity:1}
.perde{display:none}
@media (max-width:820px){
  #menu,#yan-kapat{display:flex}
  .yan{position:fixed;top:0;bottom:0;left:0;z-index:30;width:min(82vw,300px);transform:translateX(-100%);transition:transform .2s;
    padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .yan.acik{transform:none}
  .perde.acik{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
}
@media (max-width:520px){ header span{display:none} }
@media (prefers-reduced-motion:reduce){ .yan{transition:none} }
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg a{color:var(--link);font-weight:700}
.me a{color:#fff}
.ai{align-self:flex-start;background:var(--bubble-ai);border-bottom-left-radius:6px}
.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:6px}
.quick{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.quick button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:8px 12px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
.quick button:focus-visible,#send:focus-visible,#in:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
form{display:flex;gap:8px;padding:8px 16px 14px}
#in{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:14px;padding:12px 14px;font:inherit;font-size:1rem}
#send{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;
  padding:0 18px;border-radius:14px;cursor:pointer}
#send:disabled{opacity:.6;cursor:default}
.msg pre{background:rgba(0,0,0,.14);padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0;white-space:pre;font-size:.88rem}
.msg code{font-family:ui-monospace,Consolas,monospace}
.msg strong{font-weight:800}
.msg img.ek{display:block;max-width:100%;max-height:200px;border-radius:12px;margin-top:8px}
.ikon{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;width:44px;font-size:1.1rem;cursor:pointer}
.ikon.acik{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ikon:focus-visible,.quick button.acik:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.quick button.acik{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#onizle{display:none;align-items:center;gap:10px;padding:0 16px 6px}
#onizle img{height:52px;width:52px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
#onizle .ikon{width:36px;height:36px;font-size:.9rem}
</style>
</head>
<body>
<div class="kap">
<aside id="yan" class="yan" aria-label="Sohbetler">
  <div class="yan-ust"><strong>Sohbetler</strong><button id="yan-kapat" type="button" aria-label="Paneli kapat">✕</button></div>
  <button id="yeni" class="yeni" type="button">➕ Yeni sohbet</button>
  <div id="liste" class="liste"></div>
</aside>
<div id="perde" class="perde"></div>
<div class="ana">
<div class="app">
  <header>
    <button id="menu" type="button" aria-label="Sohbetler">☰</button>
    <h1>Melcan AI</h1>
    <span>sohbet, bilgi, oyun, öğrenen bot</span>
    <div class="header-btns">
      <button id="theme" type="button" aria-label="Açık/koyu tema">🌓</button>
    </div>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <div id="onizle"><img id="onizle-img" alt="Seçilen resim"><button type="button" id="onizle-sil" class="ikon" aria-label="Resmi kaldır">✕</button></div>
  <form id="form">
    <input id="dosya" type="file" accept="image/*" hidden>
    <button type="button" id="ek" class="ikon" aria-label="Resim ekle" title="Resim ekle">📎</button>
    <button type="button" id="mik" class="ikon" aria-label="Sesle yaz" title="Sesle yaz">🎤</button>
    <input id="in" autocomplete="off" placeholder="Bir mesaj yaz..." aria-label="Mesaj">
    <button id="send" type="submit">Gönder</button>
  </form>
</div>
</div>
</div>
<script>
// ====== AYAR: Cloudflare Worker adresini buraya yapıştır ======
// Örnek: "https://melcan-ai.kullaniciadin.workers.dev"
// Boş bırakırsan site sadece yerel (çevrimdışı) modda çalışır.
const WORKER_URL = "https://melcan-ai.fatmafetretmrt.workers.dev";
// ==============================================================

const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.toLocaleLowerCase("tr").replace(/[ıİ]/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
  .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[âä]/g,"a").replace(/[î]/g,"i")
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}

function has(m,key){
  if((" "+m).includes(" "+key)) return true;
  if(key.includes(" ")||key.length<4) return false;
  const tol=key.length>=7?2:1;
  return m.split(" ").some(w=>w.length>=3&&lev(w,key)<=tol);
}
const hasAny=(m,keys)=>keys.some(k=>has(m,k));

const L={get(){try{return JSON.parse(localStorage.getItem("melcan_ogrendi")||"{}");}catch(e){return {};}},
  set(o){try{localStorage.setItem("melcan_ogrendi",JSON.stringify(o));}catch(e){}}};

let isim="";
try{ isim=localStorage.getItem("melcan_isim")||""; }catch(e){}
let bekleIsim=!isim;
let mod="",sayi=0,hak=0,benP=0,onP=0,bekleyenSoru="";
let gecmis=[];       // yapay zekaya gönderilen sohbet geçmişi
let bekliyor=false;  // cevap beklenirken ikinci mesajı engelle
const log=document.getElementById("log");
const sendBtn=document.getElementById("send");

// ---- Yapay zeka: Worker üzerinden (API key sunucuda gizli), cevap akarak gelir ----
let sesliAcik=false, bekleyenResim=null;
try{ sesliAcik=localStorage.getItem("melcan_sesli")==="1"; }catch(e){}

async function askAI(mesaj,resim,onParca){
  const ctrl=new AbortController();
  let zt=setTimeout(()=>ctrl.abort(),65000);
  let res;
  try{
    res=await fetch(WORKER_URL,{
      method:"POST",
      signal:ctrl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:mesaj,history:gecmis,image:resim?{mime:resim.mime,data:resim.data}:undefined})
    });
  }catch(e){
    clearTimeout(zt);
    throw new Error(e.name==="AbortError"?"Cevap çok geç geldi, tekrar dene.":"Sunucuya ulaşılamadı.");
  }
  if(!res.ok){
    clearTimeout(zt);
    let d={}; try{ d=await res.json(); }catch(e){}
    throw new Error(d.error||"Sunucu hatası ("+res.status+")");
  }
  const rd=res.body.getReader(), dec=new TextDecoder();
  let tam="";
  try{
    while(true){
      const {done,value}=await rd.read();
      if(done) break;
      clearTimeout(zt); zt=setTimeout(()=>ctrl.abort(),30000);
      tam+=dec.decode(value,{stream:true});
      onParca(tam);
    }
  }catch(e){
    if(!tam.trim()) throw new Error("Cevap yarıda kesildi, tekrar dene.");
  }finally{ clearTimeout(zt); }
  tam+=dec.decode();
  tam=tam.trim();
  if(!tam) throw new Error("Boş cevap geldi, tekrar dene.");
  return tam;
}

// ---- Güvenli biçimlendirme: **kalın**, `kod`, ``` kod bloğu ```, - liste (innerHTML kullanmaz) ----
function satirIci(el,satir){
  satir.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/).forEach(p=>{
    if(!p) return;
    if(p.startsWith("**")&&p.endsWith("**")&&p.length>4){ const b=document.createElement("strong"); b.textContent=p.slice(2,-2); el.appendChild(b); }
    else if(p.startsWith("`")&&p.endsWith("`")&&p.length>2){ const c=document.createElement("code"); c.textContent=p.slice(1,-1); el.appendChild(c); }
    else el.appendChild(document.createTextNode(p));
  });
}
function bicimle(el,metin){
  el.textContent="";
  const parcalar=metin.split("```");
  parcalar.forEach((p,i)=>{
    if(i%2===1){
      const pre=document.createElement("pre"), c=document.createElement("code");
      c.textContent=p.replace(/^[a-zA-Z0-9+#-]*\n/,"").replace(/\n$/,"");
      pre.appendChild(c); el.appendChild(pre);
    } else {
      if(i>0) p=p.replace(/^\n/,"");
      if(i<parcalar.length-1) p=p.replace(/\n$/,"");
      const satirlar=p.split("\n");
      satirlar.forEach((st,k)=>{
        st=st.replace(/^#{1,6}\s+(.*)$/,"**$1**");
        const liste=st.match(/^\s*[-*•]\s+(.*)$/);
        if(liste){ el.appendChild(document.createTextNode("• ")); satirIci(el,liste[1]); }
        else satirIci(el,st);
        if(k<satirlar.length-1) el.appendChild(document.createTextNode("\n"));
      });
    }
  });
}

const KAYIT_KEY="melcan_sohbet", GECMIS_KEY="melcan_gecmis"; // eski tek sohbet (taşıma için)
const LISTE_KEY="melcan_sohbetler", AKTIF_KEY="melcan_aktif";
let kayitli=[], sohbetler=[], aktifId="";
const yanEl=document.getElementById("yan"), perdeEl=document.getElementById("perde");
function yanAc(){ yanEl.classList.add("acik"); perdeEl.classList.add("acik"); }
function yanKapat(){ yanEl.classList.remove("acik"); perdeEl.classList.remove("acik"); }
function yeniId(){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function aktifSohbet(){ return sohbetler.find(x=>x.id===aktifId); }
function listeKaydet(){
  try{
    localStorage.setItem(LISTE_KEY,JSON.stringify(sohbetler));
    localStorage.setItem(AKTIF_KEY,aktifId);
  }catch(e){}
}
function kaydet(){
  const sh=aktifSohbet();
  if(sh){ sh.kayitli=kayitli.slice(-60); sh.gecmis=gecmis; sh.t=Date.now(); }
  listeKaydet(); listeCiz();
}
function listeCiz(){
  const kutu=document.getElementById("liste"); kutu.innerHTML="";
  sohbetler.slice().sort((a,b)=>b.t-a.t).forEach(sh=>{
    const satir=document.createElement("div"); satir.className="oge"+(sh.id===aktifId?" aktif":"");
    const ad=document.createElement("button"); ad.type="button"; ad.className="oge-ad";
    ad.textContent=sh.baslik||"Yeni sohbet"; ad.onclick=()=>sohbetAc(sh.id);
    const sil=document.createElement("button"); sil.type="button"; sil.className="oge-sil";
    sil.textContent="🗑️"; sil.setAttribute("aria-label","Sohbeti sil"); sil.onclick=()=>sohbetSil(sh.id);
    satir.append(ad,sil); kutu.appendChild(satir);
  });
}
function sohbetAc(id){
  if(bekliyor) return;
  const sh=sohbetler.find(x=>x.id===id); if(!sh) return;
  aktifId=id;
  kayitli=Array.isArray(sh.kayitli)?sh.kayitli.slice():[];
  gecmis=Array.isArray(sh.gecmis)?sh.gecmis.slice():[];
  mod=""; bekleyenSoru="";
  log.innerHTML="";
  if(kayitli.length){
    const kopya=kayitli.slice(); kayitli=[];
    kopya.forEach(x=>yaz(x.t,x.k,x.l,false));
    kayitli=kopya;
  } else yaz(selam(),"ai",null,false);
  listeKaydet(); listeCiz(); yanKapat();
}
function yeniSohbet(){
  if(bekliyor) return;
  if(aktifSohbet() && !kayitli.length){ yanKapat(); document.getElementById("in").focus(); return; }
  const sh={id:yeniId(),baslik:"Yeni sohbet",t:Date.now(),kayitli:[],gecmis:[]};
  sohbetler.unshift(sh); sohbetler=sohbetler.slice(0,25);
  sohbetAc(sh.id);
}
function sohbetSil(id){
  if(bekliyor) return;
  if(!confirm("Bu sohbet silinsin mi?")) return;
  sohbetler=sohbetler.filter(x=>x.id!==id);
  if(!sohbetler.length) sohbetler.push({id:yeniId(),baslik:"Yeni sohbet",t:Date.now(),kayitli:[],gecmis:[]});
  if(id===aktifId) sohbetAc(sohbetler[0].id); else { listeKaydet(); listeCiz(); }
}
function yaz(metin,kim,link,sakla=true){
  const d=document.createElement("div");
  d.className="msg "+kim;
  if(kim==="ai"&&!link) bicimle(d,metin); else d.textContent=metin;
  if(link){
    d.appendChild(document.createTextNode("\n"));
    const a=document.createElement("a"); a.href=link.url; a.target="_blank"; a.rel="noopener";
    a.textContent=link.text; d.appendChild(a);
  }
  log.appendChild(d); log.scrollTop=log.scrollHeight;
  if(sakla){ kayitli.push({k:kim,t:metin,l:link||null}); kayitli=kayitli.slice(-60); kaydet(); }
  return d;
}
function selam(){
  return bekleIsim?"Merhaba! Ben Melcan AI. Senin adın ne?":"Merhaba "+isim+"! Ne konuşmak istersin?";
}

function sayiCevap(m){
  if(!/^\d+$/.test(m)) return "Lütfen bir sayı yaz. (Çıkmak için 'menü' yaz)";
  const t=parseInt(m,10); hak++;
  if(t<sayi) return "Daha büyük bir sayı söyle.";
  if(t>sayi) return "Daha küçük bir sayı söyle.";
  mod=""; return "Tebrikler! "+hak+" denemede buldun! 🎉";
}

function tkmCevap(m){
  if(["kagit","kagıt"].includes(m)) m="kagit";
  const s=["tas","kagit","makas"], ad={tas:"taş",kagit:"kağıt",makas:"makas"};
  if(!s.includes(m)) return "Taş, kağıt ya da makas yazmalısın. (Çıkmak için 'menü' yaz)";
  const b=pick(s); let r="Ben "+ad[b]+" seçtim. ";
  if(m===b) r+="Berabere!";
  else if((m==="tas"&&b==="makas")||(m==="kagit"&&b==="tas")||(m==="makas"&&b==="kagit")){benP++;r+="Sen kazandın!";}
  else {onP++;r+="Ben kazandım!";}
  return r+"\nSkor: Sen "+benP+" - Ben "+onP;
}

// Yerel cevap: oyunlar + öğrenen bot (çevrimdışı mod)
function cevap(raw){
  const m=norm(raw);
  const cikis=["menu","cik","vazgec","iptal"].includes(m);

  if(mod==="ogret"){
    mod="";
    if(cikis){ bekleyenSoru=""; return "Tamam, vazgeçtik."; }
    const o=L.get(); o[bekleyenSoru]=raw.trim().slice(0,300);
    L.set(o); bekleyenSoru="";
    return "Teşekkürler, öğrendim! Bir daha sorarsan cevaplayacağım. 🧠";
  }
  if(mod){
    if(cikis){
      const son=mod==="tkm"?"Final skoru: Sen "+benP+" - Ben "+onP+". ":"";
      mod=""; return son+"Oyundan çıktık, sohbete devam edebiliriz.";
    }
    return mod==="sayi"?sayiCevap(m):tkmCevap(m);
  }
  if(has(m,"sayi")&&hasAny(m,["oyun","tahmin"])){
    mod="sayi"; sayi=1+Math.floor(Math.random()*100); hak=0;
    return "1 ile 100 arasında bir sayı tuttum, bul bakalım! (Çıkmak için 'menü' yaz)";
  }
  if(hasAny(m,["makas","tas kagit"])){
    mod="tkm"; benP=0; onP=0;
    return "Taş-kâğıt-makas! Taş, kağıt ya da makas yaz. (Çıkmak için 'menü' yaz)";
  }
  if(m==="menu") return "Sayı oyunu ya da taş-kâğıt-makas oynayabiliriz, ya da bana bir şey sor!";

  const o=L.get();
  for(const q in o) if(q===m||lev(q,m)<=Math.floor(q.length/6)) return o[q];

  mod="ogret"; bekleyenSoru=m;
  return {t:"Bunu bilmiyorum. Cevabı sen öğretir misin? Yazdığın cevabı hatırlarım. (Vazgeçmek için 'vazgeç' yaz)",
    link:{text:"🔎 Google'da ara",url:"https://www.google.com/search?q="+encodeURIComponent(raw.trim())}};
}

function yerelYaz(metin){
  const c=cevap(metin);
  if(typeof c==="string") yaz(c,"ai"); else yaz(c.t,"ai",c.link);
}

async function gonder(metin,resim){
  if(bekliyor) return;
  if(!bekleIsim){
    const sh=aktifSohbet();
    if(sh && (!sh.baslik || sh.baslik==="Yeni sohbet")) sh.baslik=metin.slice(0,40);
  }
  const benimMsg=yaz(resim?"📷 "+metin:metin,"me");
  if(resim){
    const im=document.createElement("img"); im.className="ek"; im.alt="Gönderilen resim"; im.src=resim.onizleme;
    benimMsg.appendChild(im);
  }
  if(bekleIsim){
    isim=metin.trim().slice(0,30)||"Dost"; bekleIsim=false;
    try{ localStorage.setItem("melcan_isim",isim); }catch(e){}
    yaz("Memnun oldum "+isim+"! Bana istediğin soruyu sorabilir, sayı oyunu ya da taş-kâğıt-makas oynayabilirsin.","ai");
    return;
  }

  const m=norm(metin);
  // Oyun komutları ve aktif oyun/öğretme modu yerel işlenir
  const yerel = mod
    || (has(m,"sayi")&&hasAny(m,["oyun","tahmin"]))
    || hasAny(m,["makas","tas kagit"])
    || m==="menu";

  if(!WORKER_URL || yerel){
    const t=document.createElement("div"); t.className="msg ai"; t.textContent="…";
    log.appendChild(t); log.scrollTop=log.scrollHeight;
    setTimeout(()=>{ t.remove(); yerelYaz(metin); },350);
    return;
  }

  bekliyor=true; sendBtn.disabled=true;
  const t=document.createElement("div"); t.className="msg ai"; t.textContent="…";
  log.appendChild(t); log.scrollTop=log.scrollHeight;
  let bekle=false, sonParca="", bitti=false;
  const parca=tam=>{
    sonParca=tam;
    if(bekle) return; bekle=true;
    requestAnimationFrame(()=>{ bekle=false; if(bitti) return; bicimle(t,sonParca); log.scrollTop=log.scrollHeight; });
  };
  try{
    const r=await askAI(metin,resim,parca);
    bitti=true;
    bicimle(t,r); log.scrollTop=log.scrollHeight;
    gecmis.push({role:"user",text:resim?metin+" [resim gönderildi]":metin},{role:"model",text:r});
    if(gecmis.length>20) gecmis=gecmis.slice(-20);
    kayitli.push({k:"ai",t:r,l:null}); kayitli=kayitli.slice(-60); kaydet();
    sesliOku(r);
  }catch(e){
    bitti=true;
    t.remove();
    yaz("⚠️ "+e.message,"ai");
  }finally{
    bekliyor=false; sendBtn.disabled=false;
    document.getElementById("in").focus();
  }
}

document.getElementById("form").addEventListener("submit",e=>{

  if(bekliyor) return;
  const i=document.getElementById("in"); const v=i.value.trim();
  if(!v&&!bekleyenResim) return;
  const resim=bekleyenResim; resimKaldir();
  i.value=""; gonder(v||"Bu resmi anlat.",resim);
});

(function(){
  try{
    const x=JSON.parse(localStorage.getItem(LISTE_KEY)||"[]");
    sohbetler=Array.isArray(x)?x.filter(c=>c&&c.id):[];
  }catch(e){ sohbetler=[]; }
  // Eski tek sohbeti yeni listeye taşı
  if(!sohbetler.length){
    try{
      const k=JSON.parse(localStorage.getItem(KAYIT_KEY)||"[]");
      const g=JSON.parse(localStorage.getItem(GECMIS_KEY)||"[]");
      if(Array.isArray(k)&&k.length) sohbetler.push({id:yeniId(),baslik:"Önceki sohbet",t:Date.now(),kayitli:k,gecmis:Array.isArray(g)?g:[]});
    }catch(e){}
  }
  let id="";
  try{ id=localStorage.getItem(AKTIF_KEY)||""; }catch(e){}
  if(bekleIsim){
    // İsim henüz alınmadıysa boş bir sohbetle başla
    let bos=sohbetler.find(c=>!(c.kayitli&&c.kayitli.length));
    if(!bos){ bos={id:yeniId(),baslik:"Yeni sohbet",t:Date.now(),kayitli:[],gecmis:[]}; sohbetler.unshift(bos); }
    id=bos.id;
  } else {
    if(!sohbetler.length) sohbetler.push({id:yeniId(),baslik:"Yeni sohbet",t:Date.now(),kayitli:[],gecmis:[]});
    if(!sohbetler.some(c=>c.id===id)) id=sohbetler[0].id;
  }
  sohbetAc(id);
})();

// ---- Resim yükleme ----
const dosyaEl=document.getElementById("dosya"), onizleEl=document.getElementById("onizle");
function resimKaldir(){
  bekleyenResim=null; dosyaEl.value=""; onizleEl.style.display="none";
}
function resmiHazirla(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const k=Math.min(1,1024/Math.max(im.width,im.height));
      const w=Math.round(im.width*k), h=Math.round(im.height*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
      let kal=.82, d=c.toDataURL("image/jpeg",kal);
      while(d.length>1400000&&kal>.4){ kal-=.12; d=c.toDataURL("image/jpeg",kal); }
      res({mime:"image/jpeg",data:d.split(",")[1],onizleme:d});
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("Resim okunamadı.")); };
    im.src=url;
  });
}
document.getElementById("ek").onclick=()=>{ if(!WORKER_URL) return; dosyaEl.click(); };
dosyaEl.addEventListener("change",async()=>{
  const f=dosyaEl.files&&dosyaEl.files[0]; if(!f) return;
  try{
    bekleyenResim=await resmiHazirla(f);
    document.getElementById("onizle-img").src=bekleyenResim.onizleme;
    onizleEl.style.display="flex";
    document.getElementById("in").focus();
  }catch(e){ yaz("⚠️ "+e.message,"ai",null,false); resimKaldir(); }
});
document.getElementById("onizle-sil").onclick=resimKaldir;

// ---- Sesle yazma ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mikEl=document.getElementById("mik");
if(!SR){ mikEl.style.display="none"; }
else{
  let rec=null, dinliyor=false;
  mikEl.onclick=()=>{
    if(dinliyor&&rec){ rec.stop(); return; }
    rec=new SR(); rec.lang="tr-TR"; rec.interimResults=true; rec.continuous=false;
    const giris=document.getElementById("in"); const onceki=giris.value;
    rec.onresult=e=>{
      let m=""; for(let i=0;i<e.results.length;i++) m+=e.results[i][0].transcript;
      giris.value=(onceki?onceki+" ":"")+m;
    };
    rec.onstart=()=>{ dinliyor=true; mikEl.classList.add("acik"); };
    rec.onend=()=>{ dinliyor=false; mikEl.classList.remove("acik"); };
    rec.onerror=()=>{ dinliyor=false; mikEl.classList.remove("acik"); };
    try{ rec.start(); }catch(e){}
  };
}

// ---- Sesli okuma + internet anahtarları ----
const TTS="speechSynthesis" in window;
function sesliOku(metin){
  if(!sesliAcik||!TTS) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(metin.replace(/```[\s\S]*?```/g," kod bloğu ").replace(/[*`#]/g,""));
    u.lang="tr-TR"; speechSynthesis.speak(u);
  }catch(e){}
}
function anahtarEkle(etiket,aciklama,get,set,anahtar){
  const b=document.createElement("button"); b.type="button";
  const ciz=()=>{ b.textContent=etiket+(get()?": açık":": kapalı"); b.classList.toggle("acik",get()); b.setAttribute("aria-pressed",get()); b.title=aciklama; };
  b.onclick=()=>{ set(!get()); try{ localStorage.setItem(anahtar,get()?"1":"0"); }catch(e){} ciz(); };
  ciz(); q.appendChild(b);
}
if(TTS) anahtarEkle("🔊 Sesli","Cevapları sesli oku",()=>sesliAcik,v=>{sesliAcik=v; if(!v){ try{speechSynthesis.cancel();}catch(e){} }},"melcan_sesli");
